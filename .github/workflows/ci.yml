name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "CHANGELOG.md"
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: swift test --quiet

      - name: Lint
        run: |
          brew install swiftlint
          swiftlint --strict || true
