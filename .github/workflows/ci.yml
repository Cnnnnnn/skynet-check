name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "CHANGELOG.md"
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    env:
      # Xcode 16 ships the Swift 6 toolchain the package requires.
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: swift test --quiet
